name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,soundcheck]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  web-prototypes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Music Ministry JavaScript tests
        run: |
          node --test \
            prototypes/music-ministry/tests/chords.test.mjs \
            prototypes/music-ministry/tests/lineups.test.mjs \
            prototypes/music-ministry/tests/ministry.test.mjs \
            prototypes/music-ministry/tests/song-export.test.mjs \
            prototypes/music-ministry/tests/browser_backup.test.mjs \
            prototypes/music-ministry/tests/browser_restore.test.mjs
      - name: Chord Converter JavaScript tests
        run: node --test prototypes/chord-converter/tests/converter.test.mjs

  music-store-prototype:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run isolated synthetic music-store tests
        run: |
          python -W error::ResourceWarning -m unittest discover \
            -s prototypes/music-ministry/tests \
            -p test_shared_store.py \
            -v
      - name: Run isolated synthetic HTTP API tests
        run: |
          python -W error::ResourceWarning -m unittest discover \
            -s prototypes/music-ministry/tests \
            -p test_phase3_dev_api.py \
            -v
