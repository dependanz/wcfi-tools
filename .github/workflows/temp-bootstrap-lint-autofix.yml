name: Bootstrap lint safe-fixes (temporary)
on:
  push:
    branches: ["chore/dev-bootstrap-ci"]
permissions:
  contents: write
jobs:
  ruff-safe-fixes:
    if: github.repository == 'dependanz/wcfi-tools'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply only Ruff safe autofixes
        shell: bash
        run: |
          python -m pip install "ruff==0.17.4"
          ruff check --fix . || true
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src tests
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Ruff safe autofixes to checkpoint"
            git push origin HEAD:refs/heads/chore/dev-bootstrap-ci
          fi
      - name: Report outstanding lint errors
        shell: bash
        run: ruff check . || true
